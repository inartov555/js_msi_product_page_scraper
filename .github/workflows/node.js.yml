# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
  workflow_dispatch:
    inputs:
      url:
        description: 'Product URL'
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: .

jobs:
  scraper:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Node project
        id: node_project
        shell: bash
        run: |
          if [ -s "package.json" ] && node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f "package-lock.json" ]; then
            echo "lock_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "lock_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js ${{ matrix.node-version }} with cache
        if: steps.node_project.outputs.exists == 'true' && steps.node_project.outputs.lock_exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use Node.js ${{ matrix.node-version }} without cache
        if: steps.node_project.outputs.exists == 'true' && steps.node_project.outputs.lock_exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run scraper
        if: steps.node_project.outputs.exists == 'true'
        env:
          PRODUCT_URL: ${{ github.event.inputs.url || vars.PRODUCT_URL }}
        run: |
          # echo "PRODUCT_URL is configured"
          # echo "Node sees PRODUCT_URL:"
          # node -e 'console.log(Boolean(process.env.PRODUCT_URL))'
          # echo "Actual scraper code:"
          # grep -n "targetUrl" src/scraper.js

          npm install
          npx playwright install --with-deps chromium
          CMD npm run crawl

      - name: Upload coverage artifact
        if: always() && hashFiles('coverage/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.node-version }}
          path: coverage
