# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:

  workflow_dispatch:
    inputs:
      url:
        description: 'Product URL'
        required: false
        type: string

permissions:
  contents: read

jobs:
  js_scrape:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        env:
          PRODUCT_URL: ${{ inputs.url || vars.PRODUCT_URL }}
          HEADLESS: 'true'
        run: |
          echo "Running MSI scraper"

          if [ -n "$PRODUCT_URL" ]; then
            echo "Using PRODUCT_URL from GitHub Actions"
          else
            echo "No PRODUCT_URL supplied; scraper will use TARGET_URL from src/scrape.js"
          fi

          npm run scrape

      - name: Upload scraped product
        if: always() && hashFiles('output/product.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: msi-product-${{ matrix.node-version }}
          path: output/product.json
